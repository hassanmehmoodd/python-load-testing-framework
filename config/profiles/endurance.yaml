# Endurance / soak shape with a short demo duration.
# A real soak is often measured in hours. This repository caps duration at
# 600 seconds and ships 45 seconds so the demo stays cheap and local.
target:
  base_url: "http://127.0.0.1:8000"
  auth:
    login_path: "/api/v1/auth/login"
    me_path: "/api/v1/auth/me"
    username: "demo"
    password: "demo-pass"

safeguards:
  max_users: 25
  max_spawn_rate: 10
  allowed_hosts:
    - localhost
    - 127.0.0.1
    - "::1"

load:
  profile: endurance
  users: 8
  spawn_rate: 2
  duration_seconds: 45
  wait_min_seconds: 0.05
  wait_max_seconds: 0.25

output:
  directory: reports/latest
