# Stress: climb to the configured peak and hold it.
target:
  base_url: "http://127.0.0.1:8000"
  auth:
    login_path: "/api/v1/auth/login"
    me_path: "/api/v1/auth/me"
    username: "demo"
    password: "demo-pass"

safeguards:
  max_users: 25
  max_spawn_rate: 10
  allowed_hosts:
    - localhost
    - 127.0.0.1
    - "::1"

load:
  profile: stress
  users: 20
  spawn_rate: 4
  duration_seconds: 40
  wait_min_seconds: 0.05
  wait_max_seconds: 0.15

output:
  directory: reports/latest
