name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Start local target API
        run: |
          python -m uvicorn target_app.app:app --host 127.0.0.1 --port 8000 > /tmp/perfload-target.log 2>&1 &
          echo $! > /tmp/perfload-target.pid
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("target did not become healthy; see /tmp/perfload-target.log")
          PY

      - name: Smoke load test
        run: perfload run --config config/smoke.yaml --output reports/ci --wait-for-target 10
        env:
          TARGET_LATENCY_MS: "0"
          TARGET_LATENCY_JITTER_MS: "0"
          TARGET_ERROR_RATE: "0"

      - name: Validate report artifacts
        run: perfload validate --output reports/ci --strict-success

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: reports/ci/**
          if-no-files-found: error
